<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="hud">
            <h1>Snake</h1>
            <div class="scores">
                <div class="score-box">
                    <span class="label">Score</span>
                    <span id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="label">Best</span>
                    <span id="high-score">0</span>
                </div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
            <div id="overlay" class="overlay">
                <p id="overlay-title">Snake Game</p>
                <p id="overlay-text">Use arrow keys or WASD to move</p>
                <button id="start-btn" type="button">Start Game</button>
            </div>
        </div>

        <p class="hint">Arrows / WASD to move · Space to pause · Eat food, avoid walls and yourself</p>

        <div class="dpad" aria-label="On-screen controls">
            <button type="button" data-dir="up">▲</button>
            <div class="dpad-mid">
                <button type="button" data-dir="left">◀</button>
                <button type="button" data-dir="right">▶</button>
            </div>
            <button type="button" data-dir="down">▼</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
